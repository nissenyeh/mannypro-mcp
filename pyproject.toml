[project]
name = "mannypro-mcp"
version = "0.1.0"
description = "MCP server for reading 曼報 Pro (pro.manny-li.com) member articles"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3",
    "httpx>=0.27",
    "lxml>=5",
    "markdownify>=0.13",
    "faster-whisper>=1.1",
    # faster-whisper 1.2 passes an argument PyAV 17+ removed
    "av<17",
]

[project.scripts]
mannypro-mcp = "mannypro_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
